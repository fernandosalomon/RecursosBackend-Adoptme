paths:
  /pets:
    get:
      tags: [Pets]
      summary: Obtener todas las mascotas
      responses:
        "200":
          description: Listado de mascotas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      payload:
                        type: array
                        items:
                          $ref: "#/components/schemas/Pet"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Pets]
      summary: Crear una mascota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "200":
          description: Mascota creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Pet"
              example:
                status: success
                message: Pet added
                payload:
                  _id: 64f1b2c3d4e5f6a7b8c9d0e2
                  name: Firulais
                  specie: dog
                  birthDate: "2020-05-10"
                  adopted: false
                  image: ""
        "400":
          description: Faltan campos obligatorios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                status: error
                message: Incomplete values
                payload: null
        "500":
          $ref: "#/components/responses/InternalServerError"

  /pets/withimage:
    post:
      tags: [Pets]
      summary: Crear una mascota con imagen adjunta
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - specie
                - birthDate
                - image
              properties:
                name:
                  type: string
                  example: Firulais
                specie:
                  type: string
                  example: dog
                birthDate:
                  type: string
                  format: date
                  example: "2020-05-10"
                image:
                  type: string
                  format: binary
                  description: Archivo de imagen de la mascota
      responses:
        "200":
          description: Mascota creada. El payload contiene el ID de la mascota creada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      payload:
                        type: string
                        description: ID de la mascota creada
              example:
                status: success
                message: Pet added
                payload: 64f1b2c3d4e5f6a7b8c9d0e2
        "400":
          description: Faltan campos obligatorios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                status: error
                message: Incomplete values
                payload: null
        "500":
          $ref: "#/components/responses/InternalServerError"

  /pets/{pid}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    put:
      tags: [Pets]
      summary: Actualizar una mascota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetUpdateInput"
      responses:
        "200":
          description: Mascota actualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Pet"
              example:
                status: success
                message: pet updated
                payload:
                  _id: 64f1b2c3d4e5f6a7b8c9d0e2
                  name: Firulais
                  specie: dog
                  birthDate: "2020-05-10"
                  adopted: false
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Pets]
      summary: Eliminar una mascota
      responses:
        "200":
          description: Mascota eliminada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                status: success
                message: pet deleted
                payload: {}
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    ApiResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation completed successfully
        payload:
          type: object
      required:
        - status
        - message
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Error message
        payload:
          type: object
          nullable: true
          example: null
      required:
        - status
        - message
    Pet:
      type: object
      properties:
        _id:
          type: string
          example: 64f1b2c3d4e5f6a7b8c9d0e2
        name:
          type: string
          example: Firulais
        specie:
          type: string
          example: dog
        birthDate:
          type: string
          format: date
          example: "2020-05-10"
        adopted:
          type: boolean
          default: false
        owner:
          type: string
          nullable: true
          description: ID del usuario dueño (si fue adoptada)
          example: 64f1b2c3d4e5f6a7b8c9d0e1
        image:
          type: string
          example: ""
      required:
        - name
        - specie
    PetInput:
      type: object
      required:
        - name
        - specie
        - birthDate
      properties:
        name:
          type: string
          example: Firulais
        specie:
          type: string
          example: dog
        birthDate:
          type: string
          format: date
          example: "2020-05-10"
        image:
          type: string
          example: ""
    PetUpdateInput:
      type: object
      properties:
        name:
          type: string
          example: Firulais
        specie:
          type: string
          example: dog
        birthDate:
          type: string
          format: date
          example: "2020-05-10"
        adopted:
          type: boolean
          example: false
        owner:
          type: string
          nullable: true
          example: 64f1b2c3d4e5f6a7b8c9d0e1
        image:
          type: string
          example: ""
  parameters:
    PetId:
      name: pid
      in: path
      required: true
      schema:
        type: string
      description: ID de mascota en formato ObjectId
  responses:
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            status: error
            message: Internal server error
            payload: null